name: PostgreSQL benchmark

on:
  push:
    branches: [perf/postgres-actions]
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark size
        type: choice
        options: [quick, full, load]
        default: quick
      cache_fixture:
        description: Restore/save the full logical fixture instead of regenerating
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: postgres-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: ${{ !contains(github.event.head_commit.message, '[kine') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BENCH_PROFILE: ${{ inputs.profile || (contains(github.event.head_commit.message, '[bench:load]') && 'load' || contains(github.event.head_commit.message, '[bench:full]') && 'full' || 'quick') }}
      BENCH_CACHE_FIXTURE: ${{ inputs.cache_fixture || contains(github.event.head_commit.message, '[bench:cache]') }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kine_bench?sslmode=disable
      BENCH_OUTPUT: ${{ github.workspace }}/benchmark-results.json
      BENCH_FIXTURE_CACHE: ${{ github.workspace }}/.bench-fixtures
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Select workload
        run: |
          if [[ "$BENCH_PROFILE" == full ]]; then
            echo 'BENCH_KEYS=20000' >> "$GITHUB_ENV"
            echo 'BENCH_WRITE_OPS=5000' >> "$GITHUB_ENV"
            echo 'BENCH_REPETITIONS=9' >> "$GITHUB_ENV"
            echo 'BENCH_TRIALS=5' >> "$GITHUB_ENV"
          elif [[ "$BENCH_PROFILE" == load ]]; then
            echo 'BENCH_KEYS=100' >> "$GITHUB_ENV"
            echo 'BENCH_WRITE_OPS=20000' >> "$GITHUB_ENV"
            echo 'BENCH_REPETITIONS=1' >> "$GITHUB_ENV"
            echo 'BENCH_TRIALS=1' >> "$GITHUB_ENV"
            echo 'BENCH_CONCURRENT_ONLY=1' >> "$GITHUB_ENV"
            echo 'BENCH_CHECKPOINT=1' >> "$GITHUB_ENV"
          else
            echo 'BENCH_KEYS=2000' >> "$GITHUB_ENV"
            echo 'BENCH_WRITE_OPS=300' >> "$GITHUB_ENV"
            echo 'BENCH_REPETITIONS=3' >> "$GITHUB_ENV"
            echo 'BENCH_TRIALS=3' >> "$GITHUB_ENV"
          fi
          echo 'BENCH_VERSIONS=15' >> "$GITHUB_ENV"
          echo "PG_MAJOR=$(pg_config --version | sed -E 's/PostgreSQL ([0-9]+).*/\1/')" >> "$GITHUB_ENV"

      - name: Restore Node dependencies
        id: dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: hack/postgres-bench/node_modules
          key: postgres-bench-node22-${{ runner.os }}-${{ hashFiles('hack/postgres-bench/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: hack/postgres-bench
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Restore seed fixture
        if: env.BENCH_PROFILE == 'full' && env.BENCH_CACHE_FIXTURE == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .bench-fixtures
          key: postgres-bench-fixture-v1-pg${{ env.PG_MAJOR }}-${{ env.BENCH_PROFILE }}-${{ hashFiles('hack/postgres-bench/fixture.mjs') }}

      - name: Start native PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb kine_bench
          pg_isready

      - name: Benchmark baseline and candidates
        run: |
          if [[ "$BENCH_PROFILE" != full || "$BENCH_CACHE_FIXTURE" != true ]]; then
            unset BENCH_FIXTURE_CACHE
          fi
          node hack/postgres-bench/benchmark.mjs

      - name: Summarize measurements
        run: node hack/postgres-bench/summary.mjs benchmark-results.json

      - name: Upload measurements and query plans
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-bench-${{ env.BENCH_PROFILE }}-${{ github.run_attempt }}
          path: |
            benchmark-results.json
            benchmark-summary.md
            benchmark-machine.json
          retention-days: 14
          if-no-files-found: warn

name: Kine PostgreSQL API benchmark

on:
  push:
    branches: [perf/postgres-actions]
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark size
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

concurrency:
  group: kine-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kine')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BENCH_PROFILE: ${{ inputs.profile || (contains(github.event.head_commit.message, '[kine:full]') && 'full' || 'quick') }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      GOMAXPROCS: 4
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Restore benchmark binary
        id: binary
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .kine-bench-bin
          key: kine-e2e-v1-linux-amd64-${{ hashFiles('go.mod', 'go.sum', 'pkg/**/*.go', 'hack/kine-bench/*.go') }}
      - name: Set up Go
        if: steps.binary.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go modules and build cache
        if: steps.binary.outputs.cache-hit != 'true'
        id: go-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: kine-go-v1-linux-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build Kine and API benchmark
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          go test ./pkg/logstructured ./pkg/drivers/generic ./pkg/drivers/pgsql
          go build -buildvcs=false -trimpath -o .kine-bench-bin/kine-bench ./hack/kine-bench
      - name: Save Go build cache before running tests
        if: steps.binary.outputs.cache-hit != 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Save compiled binary before running tests
        if: steps.binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .kine-bench-bin
          key: ${{ steps.binary.outputs.cache-primary-key }}
      - name: Start native PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres'"
          pg_isready
      - name: Check API semantics and compare baseline with atomic updates
        run: .kine-bench-bin/kine-bench
      - name: Summarize actual Kine measurements
        run: python3 hack/kine-bench/summary.py
      - name: Upload API measurements and Kine server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kine-postgres-${{ env.BENCH_PROFILE }}-${{ github.run_attempt }}
          path: |
            kine-results.json
            kine-summary.md
            kine-machine.json
            kine-bench-logs/
          retention-days: 14
          if-no-files-found: warn
